<body class="font-sans text-brand-black antialiased bg-white pt-20 min-h-screen flex flex-col">

    <header id="common-header" class="fixed w-full top-0 z-50 transition-all duration-300 bg-brand-black text-white"></header>

    <main class="flex-grow bg-brand-gray">
        <section class="bg-brand-black text-white px-6 py-20 md:py-24">
            <div class="container mx-auto max-w-6xl fade-up">
                <p class="font-en text-xs tracking-widest text-gray-400 mb-4">SHOPPING CART</p>
                <h1 class="font-en text-4xl md:text-5xl font-bold tracking-widest mb-4">CART</h1>
                <p class="max-w-2xl text-sm md:text-base text-gray-300 leading-loose">
                    カート内の商品を確認し、数量追加または削除できます。
                </p>
            </div>
        </section>

        <section class="px-6 py-12 md:py-16">
            <div class="container mx-auto max-w-6xl">
                <div id="cart-alert" class="hidden mb-6 rounded-2xl border px-4 py-3 text-sm"></div>

                <div class="grid lg:grid-cols-[minmax(0,1.5fr)_360px] gap-8 items-start">
                    <div class="fade-up">
                        <div class="bg-white border border-gray-200 rounded-3xl overflow-hidden">
                            <div class="px-6 py-5 border-b border-gray-200 flex items-center justify-between">
                                <div>
                                    <p class="font-en text-xs tracking-widest text-gray-400">CART DETAILS</p>
                                    <h2 class="text-xl font-bold mt-1">選択中の商品</h2>
                                </div>
                                <button id="reload-cart-btn" type="button" class="inline-flex items-center gap-2 text-xs font-en tracking-widest border border-gray-300 px-4 py-2 hover:bg-gray-50 transition">
                                    <i class="fa-solid fa-rotate-right"></i>
                                    RELOAD
                                </button>
                            </div>
                            <div id="cart-loading" class="px-6 py-16 text-center text-gray-500">
                                <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
                            </div>
                            <div id="cart-empty" class="hidden px-6 py-16 text-center">
                                <p class="font-en text-2xl tracking-widest mb-4">YOUR CART IS EMPTY</p>
                                <p class="text-sm text-gray-500 mb-8">商品を追加するとここに表示されます。</p>
                                <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                                    <a href="https://exs.customjapan.net/product/exs-street/purchase" class="w-full sm:w-auto bg-brand-black text-white px-6 py-3 text-sm font-en tracking-widest hover:opacity-85 transition text-center">BUY eXs Street</a>
                                    <a href="https://exs.customjapan.net/accessories" class="w-full sm:w-auto border border-brand-black px-6 py-3 text-sm font-en tracking-widest hover:bg-brand-black hover:text-white transition text-center">ACCESSORIES</a>
                                </div>
                            </div>
                            <div id="cart-list" class="hidden divide-y divide-gray-200"></div>
                        </div>
                    </div>

                    <aside class="fade-up">
                        <div class="bg-white border border-gray-200 rounded-3xl p-6 sticky top-28">
                            <p class="font-en text-xs tracking-widest text-gray-400 mb-3">ORDER SUMMARY</p>
                            <div class="space-y-4 text-sm">
                                <div class="flex items-center justify-between">
                                    <span class="text-gray-500">商品数</span>
                                    <span id="summary-count" class="font-en text-lg">0</span>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span class="text-gray-500">小計</span>
                                    <span id="summary-subtotal" class="font-en text-lg">0円</span>
                                </div>
                            </div>
                            <div class="mt-6 pt-6 border-t border-gray-200">
                                <div class="flex items-center justify-between">
                                    <span class="font-en tracking-widest">TOTAL</span>
                                    <span id="summary-total" class="font-en text-3xl font-bold">0円</span>
                                </div>
                                <p class="mt-4 text-xs text-gray-500 leading-relaxed">
                                    送料・手数料は注文画面で確定します。
                                </p>
                            </div>
                            <div class="mt-8 space-y-3">
                                <button id="cart-checkout-btn" type="button" class="hidden w-full bg-brand-black text-white text-center py-3 text-sm font-en tracking-widest hover:opacity-85 transition">PROCEED TO PURCHASE</button>
                                <p id="cart-checkout-note" class="hidden text-xs text-gray-500 leading-relaxed"></p>
                                <a href="https://exs.customjapan.net/accessories" class="block w-full border border-brand-black text-center py-3 text-sm font-en tracking-widest hover:bg-brand-black hover:text-white transition">CONTINUE SHOPPING</a>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>
        </section>

        <section class="px-6 pb-16 md:pb-24">
            <div class="container mx-auto max-w-6xl">
                <div class="fade-up bg-white border border-gray-200 rounded-3xl overflow-hidden">
                    <div class="px-6 py-5 border-b border-gray-200">
                        <p class="font-en text-xs tracking-widest text-gray-400">RECOMMENDED ACCESSORIES</p>
                        <h2 class="text-xl font-bold mt-1">オプション / アクセサリー</h2>
                    </div>
                    <div id="cart-accessories-loading" class="px-6 py-16 text-center text-gray-500">
                        <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
                    </div>
                    <div id="cart-accessories-empty" class="hidden px-6 py-16 text-center text-gray-500">
                        アクセサリー情報を取得できませんでした。
                    </div>
                    <div id="cart-accessories-grid" class="hidden grid md:grid-cols-2 xl:grid-cols-3 gap-6 p-6"></div>
                </div>
            </div>
        </section>
    </main>

    <footer id="common-footer" class="bg-brand-black text-white pt-20 pb-10 px-6"></footer>
