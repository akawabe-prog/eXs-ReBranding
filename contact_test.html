    <script>
        (function () {
            var startedAt = document.getElementById('form_started_at');
            var jsEnabled = document.getElementById('js_enabled');
            var csrfTokenField = document.getElementById('csrf_token');
            if (startedAt) startedAt.value = String(Math.floor(Date.now() / 1000));
            if (jsEnabled) jsEnabled.value = '1';
            if (csrfTokenField) {
                var token = (window.crypto && window.crypto.randomUUID)
                    ? window.crypto.randomUUID().replace(/-/g, '')
                    : (Math.random().toString(36).slice(2) + Date.now().toString(36));
                csrfTokenField.value = token;
                var secure = location.protocol === 'https:' ? '; Secure' : '';
                document.cookie = 'exs_ct_csrf=' + encodeURIComponent(token) + '; Path=/; Max-Age=7200; SameSite=Lax' + secure;
            }
        }());
