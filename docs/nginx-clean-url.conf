# Clean URL rewrite rules for eXs
# Usage:
# 1) Place this snippet inside the target `server { ... }`.
# 2) Ensure `root` points to the directory that contains `index.html`, `product-*.html`, etc.

# Canonical top pages
location = /index {
    return 301 /;
}

location = /index.html {
    return 301 /;
}

location = /exs-api/index {
    return 301 /exs-api/;
}

location = /exs-api/index.html {
    return 301 /exs-api/;
}

# Canonical redirects for direct .html access (root)
location = /about.html { return 301 /about; }
location = /accessories.html { return 301 /accessories; }
location = /support.html { return 301 /support; }
location = /news-list.html { return 301 /news; }
location = /developer.html { return 301 /developer; }
location = /partner.html { return 301 /partner; }
location = /partner-list.html { return 301 /partner-list; }
location = /partner-entry.html { return 301 /partner-entry; }
location = /faq.html { return 301 /faq; }
location = /contact.html { return 301 /contact; }
location = /company.html { return 301 /company; }
location = /privacy.html { return 301 /policy; }
location = /form-error.html { return 301 /form-error; }
location = /thanks.html { return 301 /thanks; }
location = /product-intro-street.html { return 301 /product/exs-street; }
location = /product-intro-tkg.html { return 301 /product/exs-1-tkg; }
location = /product-street.html { return 301 /product/exs-street/purchase; }
location = /product-tkg.html { return 301 /product/exs-1-tkg/purchase; }
location = /colum-list.html { return 301 /colum; }
location = /colum-detail-50cc.html { return 301 /colum/50cc; }
location = /colum-detail-tkg.html { return 301 /colum/tkg; }
location = /colum-detail-mopet.html { return 301 /colum/mopet; }
location = /colum-detail-cyclemodeosaka2026.html { return 301 /colum/cyclemodeosaka2026; }
location = /colum-detail.html { return 301 /colum/detail; }

# Canonical redirects for direct .html access (/exs-api)
location = /exs-api/about.html { return 301 /exs-api/about; }
location = /exs-api/accessories.html { return 301 /exs-api/accessories; }
location = /exs-api/support.html { return 301 /exs-api/support; }
location = /exs-api/news-list.html { return 301 /exs-api/news; }
location = /exs-api/developer.html { return 301 /exs-api/developer; }
location = /exs-api/partner.html { return 301 /exs-api/partner; }
location = /exs-api/partner-list.html { return 301 /exs-api/partner-list; }
location = /exs-api/partner-entry.html { return 301 /exs-api/partner-entry; }
location = /exs-api/faq.html { return 301 /exs-api/faq; }
location = /exs-api/contact.html { return 301 /exs-api/contact; }
location = /exs-api/company.html { return 301 /exs-api/company; }
location = /exs-api/privacy.html { return 301 /exs-api/policy; }
location = /exs-api/form-error.html { return 301 /exs-api/form-error; }
location = /exs-api/thanks.html { return 301 /exs-api/thanks; }
location = /exs-api/product-intro-street.html { return 301 /exs-api/product/exs-street; }
location = /exs-api/product-intro-tkg.html { return 301 /exs-api/product/exs-1-tkg; }
location = /exs-api/product-street.html { return 301 /exs-api/product/exs-street/purchase; }
location = /exs-api/product-tkg.html { return 301 /exs-api/product/exs-1-tkg/purchase; }
location = /exs-api/colum-list.html { return 301 /exs-api/colum; }
location = /exs-api/colum-detail-50cc.html { return 301 /exs-api/colum/50cc; }
location = /exs-api/colum-detail-tkg.html { return 301 /exs-api/colum/tkg; }
location = /exs-api/colum-detail-mopet.html { return 301 /exs-api/colum/mopet; }
location = /exs-api/colum-detail-cyclemodeosaka2026.html { return 301 /exs-api/colum/cyclemodeosaka2026; }
location = /exs-api/colum-detail.html { return 301 /exs-api/colum/detail; }

# Root site clean URLs
location / {
    try_files $uri $uri/ @exs_clean_urls;
}

location @exs_clean_urls {
    # 301 redirects: old product/column URLs -> new clean URLs
    rewrite ^/index/?$ / permanent;
    rewrite ^/product-intro-street/?$ /product/exs-street permanent;
    rewrite ^/product-intro-tkg/?$ /product/exs-1-tkg permanent;
    rewrite ^/product-street/?$ /product/exs-street/purchase permanent;
    rewrite ^/product-tkg/?$ /product/exs-1-tkg/purchase permanent;
    rewrite ^/colum-list/?$ /colum permanent;
    rewrite ^/colum-detail-50cc/?$ /colum/50cc permanent;
    rewrite ^/colum-detail-tkg/?$ /colum/tkg permanent;
    rewrite ^/colum-detail-mopet/?$ /colum/mopet permanent;
    rewrite ^/colum-detail-cyclemodeosaka2026/?$ /colum/cyclemodeosaka2026 permanent;
    rewrite ^/colum-detail/?$ /colum/detail permanent;
    rewrite ^/news-list/?$ /news permanent;
    rewrite ^/privacy/?$ /policy permanent;

    # Product routes
    rewrite ^/product/exs-street/?$ /product-intro-street.html last;
    rewrite ^/product/exs-1-tkg/?$ /product-intro-tkg.html last;
    rewrite ^/product/exs-street/purchase/?$ /product-street.html last;
    rewrite ^/product/exs-1-tkg/purchase/?$ /product-tkg.html last;

    # Column routes
    rewrite ^/colum/?$ /colum-list.html last;
    rewrite ^/colum/50cc/?$ /colum-detail-50cc.html last;
    rewrite ^/colum/tkg/?$ /colum-detail-tkg.html last;
    rewrite ^/colum/mopet/?$ /colum-detail-mopet.html last;
    rewrite ^/colum/cyclemodeosaka2026/?$ /colum-detail-cyclemodeosaka2026.html last;
    rewrite ^/colum/detail/?$ /colum-detail.html last;

    # Alias for FAQ (actual file: faq.html)
    rewrite ^/faq/?$ /faq.html last;
    rewrite ^/news/?$ /news-list.html last;
    rewrite ^/policy/?$ /privacy.html last;

    # Generic clean URL fallback: /about -> /about.html
    rewrite ^/([A-Za-z0-9_-]+)/?$ /$1.html last;
    return 404;
}

# exs-api clean URLs when served under /exs-api
location ^~ /exs-api/ {
    try_files $uri $uri/ @exs_api_clean_urls;
}

location @exs_api_clean_urls {
    # 301 redirects: old exs-api product/column URLs -> new clean URLs
    rewrite ^/exs-api/index/?$ /exs-api/ permanent;
    rewrite ^/exs-api/product-intro-street/?$ /exs-api/product/exs-street permanent;
    rewrite ^/exs-api/product-intro-tkg/?$ /exs-api/product/exs-1-tkg permanent;
    rewrite ^/exs-api/product-street/?$ /exs-api/product/exs-street/purchase permanent;
    rewrite ^/exs-api/product-tkg/?$ /exs-api/product/exs-1-tkg/purchase permanent;
    rewrite ^/exs-api/colum-list/?$ /exs-api/colum permanent;
    rewrite ^/exs-api/colum-detail-50cc/?$ /exs-api/colum/50cc permanent;
    rewrite ^/exs-api/colum-detail-tkg/?$ /exs-api/colum/tkg permanent;
    rewrite ^/exs-api/colum-detail-mopet/?$ /exs-api/colum/mopet permanent;
    rewrite ^/exs-api/colum-detail-cyclemodeosaka2026/?$ /exs-api/colum/cyclemodeosaka2026 permanent;
    rewrite ^/exs-api/colum-detail/?$ /exs-api/colum/detail permanent;
    rewrite ^/exs-api/news-list/?$ /exs-api/news permanent;
    rewrite ^/exs-api/privacy/?$ /exs-api/policy permanent;

    # Product routes
    rewrite ^/exs-api/product/exs-street/?$ /exs-api/product-intro-street.html last;
    rewrite ^/exs-api/product/exs-1-tkg/?$ /exs-api/product-intro-tkg.html last;
    rewrite ^/exs-api/product/exs-street/purchase/?$ /exs-api/product-street.html last;
    rewrite ^/exs-api/product/exs-1-tkg/purchase/?$ /exs-api/product-tkg.html last;

    # Column routes
    rewrite ^/exs-api/colum/?$ /exs-api/colum-list.html last;
    rewrite ^/exs-api/colum/50cc/?$ /exs-api/colum-detail-50cc.html last;
    rewrite ^/exs-api/colum/tkg/?$ /exs-api/colum-detail-tkg.html last;
    rewrite ^/exs-api/colum/mopet/?$ /exs-api/colum-detail-mopet.html last;
    rewrite ^/exs-api/colum/cyclemodeosaka2026/?$ /exs-api/colum-detail-cyclemodeosaka2026.html last;
    rewrite ^/exs-api/colum/detail/?$ /exs-api/colum-detail.html last;

    # Alias for FAQ (actual file: faq.html)
    rewrite ^/exs-api/faq/?$ /exs-api/faq.html last;
    rewrite ^/exs-api/news/?$ /exs-api/news-list.html last;
    rewrite ^/exs-api/policy/?$ /exs-api/privacy.html last;

    # Generic clean URL fallback: /exs-api/about -> /exs-api/about.html
    rewrite ^/exs-api/([A-Za-z0-9_-]+)/?$ /exs-api/$1.html last;
    return 404;
}
