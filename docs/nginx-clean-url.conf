# Clean URL rewrite rules for eXs
# Usage:
# 1) Place this snippet inside the target `server { ... }`.
# 2) Ensure `root` points to the directory that contains `index.html`, `product-*.html`, etc.

# Root site clean URLs
location / {
    try_files $uri $uri/ @exs_clean_urls;
}

location @exs_clean_urls {
    # 301 redirects: old product/column URLs -> new clean URLs
    rewrite ^/product-intro-street/?$ /product/exs-street permanent;
    rewrite ^/product-intro-tkg/?$ /product/exs-1-tkg permanent;
    rewrite ^/product-street/?$ /product/exs-street/purchase permanent;
    rewrite ^/product-tkg/?$ /product/exs-1-tkg/purchase permanent;
    rewrite ^/colum-list/?$ /colum permanent;
    rewrite ^/colum-detail-50cc/?$ /colum/50cc permanent;
    rewrite ^/colum-detail-tkg/?$ /colum/tkg permanent;
    rewrite ^/colum-detail-mopet/?$ /colum/mopet permanent;
    rewrite ^/colum-detail-cyclemodeosaka2026/?$ /colum/cyclemodeosaka2026 permanent;
    rewrite ^/colum-detail/?$ /colum/detail permanent;

    # Product routes
    rewrite ^/product/exs-street/?$ /product-intro-street.html last;
    rewrite ^/product/exs-1-tkg/?$ /product-intro-tkg.html last;
    rewrite ^/product/exs-street/purchase/?$ /product-street.html last;
    rewrite ^/product/exs-1-tkg/purchase/?$ /product-tkg.html last;

    # Column routes
    rewrite ^/colum/?$ /colum-list.html last;
    rewrite ^/colum/50cc/?$ /colum-detail-50cc.html last;
    rewrite ^/colum/tkg/?$ /colum-detail-tkg.html last;
    rewrite ^/colum/mopet/?$ /colum-detail-mopet.html last;
    rewrite ^/colum/cyclemodeosaka2026/?$ /colum-detail-cyclemodeosaka2026.html last;
    rewrite ^/colum/detail/?$ /colum-detail.html last;

    # Alias for FAQ (actual file: faq.html)
    rewrite ^/faq/?$ /faq.html last;

    # Generic clean URL fallback: /about -> /about.html
    rewrite ^/([A-Za-z0-9_-]+)/?$ /$1.html last;
    return 404;
}

# exs-api clean URLs when served under /exs-api
location ^~ /exs-api/ {
    try_files $uri $uri/ @exs_api_clean_urls;
}

location @exs_api_clean_urls {
    # 301 redirects: old exs-api product/column URLs -> new clean URLs
    rewrite ^/exs-api/product-intro-street/?$ /exs-api/product/exs-street permanent;
    rewrite ^/exs-api/product-intro-tkg/?$ /exs-api/product/exs-1-tkg permanent;
    rewrite ^/exs-api/product-street/?$ /exs-api/product/exs-street/purchase permanent;
    rewrite ^/exs-api/product-tkg/?$ /exs-api/product/exs-1-tkg/purchase permanent;
    rewrite ^/exs-api/colum-list/?$ /exs-api/colum permanent;
    rewrite ^/exs-api/colum-detail-50cc/?$ /exs-api/colum/50cc permanent;
    rewrite ^/exs-api/colum-detail-tkg/?$ /exs-api/colum/tkg permanent;
    rewrite ^/exs-api/colum-detail-mopet/?$ /exs-api/colum/mopet permanent;
    rewrite ^/exs-api/colum-detail-cyclemodeosaka2026/?$ /exs-api/colum/cyclemodeosaka2026 permanent;
    rewrite ^/exs-api/colum-detail/?$ /exs-api/colum/detail permanent;

    # Product routes
    rewrite ^/exs-api/product/exs-street/?$ /exs-api/product-intro-street.html last;
    rewrite ^/exs-api/product/exs-1-tkg/?$ /exs-api/product-intro-tkg.html last;
    rewrite ^/exs-api/product/exs-street/purchase/?$ /exs-api/product-street.html last;
    rewrite ^/exs-api/product/exs-1-tkg/purchase/?$ /exs-api/product-tkg.html last;

    # Column routes
    rewrite ^/exs-api/colum/?$ /exs-api/colum-list.html last;
    rewrite ^/exs-api/colum/50cc/?$ /exs-api/colum-detail-50cc.html last;
    rewrite ^/exs-api/colum/tkg/?$ /exs-api/colum-detail-tkg.html last;
    rewrite ^/exs-api/colum/mopet/?$ /exs-api/colum-detail-mopet.html last;
    rewrite ^/exs-api/colum/cyclemodeosaka2026/?$ /exs-api/colum-detail-cyclemodeosaka2026.html last;
    rewrite ^/exs-api/colum/detail/?$ /exs-api/colum-detail.html last;

    # Alias for FAQ (actual file: faq.html)
    rewrite ^/exs-api/faq/?$ /exs-api/faq.html last;

    # Generic clean URL fallback: /exs-api/about -> /exs-api/about.html
    rewrite ^/exs-api/([A-Za-z0-9_-]+)/?$ /exs-api/$1.html last;
    return 404;
}
