            border-bottom: 1px solid var(--color-gray-light);

        }

        .filter__list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 5px;
            justify-content: center;

        .filter__item.active {
            background: var(--color-black);
            color: var(--color-white);
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 60px 0;
        }

        /* Card Style */
        .card {
            border: 1px solid var(--color-gray-light);
            transition: transform 0.3s ease;
            background: #fff;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .card__image {
            aspect-ratio: 4/3;
            background: var(--color-gray-light);
            overflow: hidden;
        }

        .card__image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card__image img {
            transform: scale(1.05);
        }

        .card__body {
            padding: 20px;
        }

        .card__tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--color-gray-mid);
            letter-spacing: 0.1em;
            display: block;
            margin-bottom: 5px;
        }

        .card__title {
            font-size: 1.1rem;
            margin: 8px 0;
            line-height: 1.4;
            font-weight: 700;
        }

        .card__compatibility {
            font-size: 0.8rem;

            color: var(--color-gray-mid);
            margin-bottom: 10px;
            display: block;

            margin-bottom: 20px;
