        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { black: '#111111', gray: '#F5F5F5' } },
                    fontFamily: { en: ['Montserrat', 'sans-serif'], sans: ['Noto Sans JP', 'sans-serif'] }
                }

        };
    </script>

<body class="font-sans text-brand-black antialiased bg-white">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PDRLTW4"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header id="common-header" class="fixed w-full top-0 z-50 bg-white/90 backdrop-blur-sm text-brand-black shadow-sm transition-all duration-300"></header>

    <main class="min-h-screen pt-40 pb-24 px-6 bg-gray-50">
        <div class="container mx-auto max-w-2xl">
            <div class="bg-white border border-red-200 shadow-sm p-8 md:p-12 text-center">
                <p class="font-en text-xs tracking-[0.2em] text-red-400 mb-4">ERROR</p>
                <h1 id="error-title" class="text-2xl md:text-3xl font-bold mb-6">送信に失敗しました</h1>
                <p id="error-message" class="text-sm text-gray-600 leading-loose mb-10">
                    お手数ですが入力内容をご確認のうえ、再度お試しください。
                </p>
                <div class="flex flex-col md:flex-row gap-3 justify-center">
                    <a id="error-back-link" href="/" class="inline-block bg-brand-black text-white px-8 py-3 text-sm font-en tracking-widest hover:bg-gray-800 transition">RETRY</a>
                    <a href="/" class="inline-block border border-gray-300 px-8 py-3 text-sm font-en tracking-widest hover:border-black transition">TOP PAGE</a>
                </div>
            </div>
        </div>
    </main>

    <footer id="common-footer" class="bg-brand-black text-white pt-20 pb-10 px-6"></footer>

    <script src="JS/components.js"></script>
    <script src="JS/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const formType = params.get('form') || 'contact';
            const title = document.getElementById('error-title');
            const message = document.getElementById('error-message');
            const backLink = document.getElementById('error-back-link');

            if (formType === 'partner') {
                title.textContent = 'パートナーエントリーの送信に失敗しました';
                message.textContent = '入力内容をご確認のうえ、再度送信してください。時間をおいても改善しない場合は support へご連絡ください。';
                backLink.href = 'partner-entry.html';
                backLink.textContent = 'ENTRY RETRY';
                return;
            }

            title.textContent = 'お問い合わせ送信に失敗しました';
            message.textContent = '入力内容をご確認のうえ、再度送信してください。時間をおいても改善しない場合は support へご連絡ください。';
            backLink.href = 'contact.html';
            backLink.textContent = 'CONTACT RETRY';
        });
    </script>
</body>
